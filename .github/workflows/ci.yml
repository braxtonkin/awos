name: ci

on:
  pull_request:
  push:
    branches: [main, build/e2e]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run check
      - run: docker compose run --rm verify npm run verify -- guardrails
      - run: docker compose run --rm verify npm run verify -- doctor

  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run verify -- models

  sims:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run verify -- sims --mutant all
      - run: docker compose run --rm verify npm run verify -- environments-sim --mutant all --profile crashes
      - run: docker compose run --rm verify npm run verify -- environments-sim --profile all
      - run: docker compose run --rm verify npm run verify -- outbox-sim --profile all
      - run: docker compose run --rm verify npm run verify -- routines-sim --profile all
      - run: docker compose run --rm verify npm run verify -- bridge-sim --seeds 20

  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run verify -- migrations
      - run: docker compose run --rm verify npm test
      - run: docker compose run --rm verify npm run verify -- engine-checks
      - run: docker compose run --rm verify npm run verify -- engine-start
      - run: docker compose run --rm verify npm run verify -- setup
      - run: docker compose run --rm verify npm run verify -- code-change
      - run: docker compose run --rm verify npm run verify -- jira
      - run: docker compose run --rm verify npm run verify -- e2e-report
      - run: docker compose run --rm verify npm run verify -- launch-faults
