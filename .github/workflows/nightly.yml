name: nightly

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run verify -- models nightly

  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [default, races, hangs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose build verify
      - run: docker compose run --rm verify npm ci
      - run: docker compose run --rm verify npm run verify -- tasks-sim --profile ${{ matrix.profile }} --seeds 1000 --steps 1000 --from $(( $(date -u +%s) / 86400 * 1000 )) --trace traces
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tasks-sim-${{ matrix.profile }}-traces
          path: traces/
